server:
  port: 8080

spring:
  application:
    name: taskflow
  datasource:
    url: jdbc:h2:mem:taskflowdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: never

app:
  jwt:
    # Override in production: JWT_SECRET env var (min 32 chars)
    secret: ${JWT_SECRET:taskflow-dev-secret-key-must-be-at-least-32-chars-long}
    access-expiration-ms: 3600000      # 1 hour
    refresh-expiration-ms: 604800000  # 7 days

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

info:
  app:
    name: TaskFlow
    version: 1.0.0

---
# PostgreSQL profile: docker compose / production
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${SPRING_DATASOURCE_USERNAME:taskflow}
    password: ${SPRING_DATASOURCE_PASSWORD:taskflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false
