<div class="layout">
  <aside class="sidebar">
    <div class="brand" routerLink="/dashboard">
      <span class="logo">◈</span>
      <span class="name">TaskFlow</span>
    </div>

    <nav>
      <a routerLink="/dashboard" routerLinkActive="active">
        <span class="icon">▦</span> Projects
      </a>
      <a routerLink="/my-tasks" routerLinkActive="active">
        <span class="icon">✓</span> My Tasks
      </a>
      @if (isAdmin) {
        <a routerLink="/admin" routerLinkActive="active">
          <span class="icon">⚙</span> Admin
        </a>
      }
    </nav>

    <div class="userbox">
      <div class="user">
        <span class="avatar">{{ (auth.user()?.username || '?')[0].toUpperCase() }}</span>
        <div class="who">
          <strong>{{ auth.user()?.username }}</strong>
          <span class="roles">{{ auth.user()?.roles.join(', ') }}</span>
        </div>
      </div>
      <div class="actions">
        <button class="ghost" (click)="logout()">Sign out</button>
        <button class="ghost danger" (click)="logoutEverywhere()" title="Revoke all sessions">
          All devices
        </button>
      </div>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
